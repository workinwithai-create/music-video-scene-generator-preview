name: PULSE v0.2.0 build check

on:
  pull_request:
    branches: [main, feature/pulse-performance-room-v0.1.0, feature/character-3d-v0.2.0]
  push:
    branches:
      - feature/pulse-performance-room-v0.1.0
      - feature/my-character-v0.1.0
      - feature/character-3d-v0.2.0
      - feature/pulse-v0.2.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Test tracking and scoring maths
        run: npm test

      - name: Typecheck and build
        run: npm run build
