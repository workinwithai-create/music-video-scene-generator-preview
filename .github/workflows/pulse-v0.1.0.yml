name: PULSE v0.1.0 build check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/pulse-performance-room-v0.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Typecheck and build
        run: npm run build
